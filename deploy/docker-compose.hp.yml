name: ${COMPOSE_PROJECT_NAME:-bill-scheduler}

services:
  app:
    image: ${AGENDADOR_IMAGE:-bill-scheduler:local}
    build:
      context: ${AGENDADOR_APP_DIR:-..}
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${AGENDADOR_ENV_FILE:-./agendador.env}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5005
      Data__FilePath: /var/lib/agendador-contas/contas.json
      DataProtection__KeysPath: /var/lib/agendador-contas/dataprotection-keys
    volumes:
      - ${AGENDADOR_DATA_DIR:-./data}:/var/lib/agendador-contas
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - edge

networks:
  edge:
    external: true
    name: ${AGENDADOR_EXTERNAL_NETWORK:-edge}
