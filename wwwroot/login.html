<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Agendador de Contas</title>
  <link rel="stylesheet" href="/login.css?v=1.0.4">
</head>
<body>
  <main>
    <h1>Agendador de Contas</h1>
    <p>Entre para aceder ao painel.</p>

    <form id="loginForm">
      <label>
        Utilizador
        <input id="username" autocomplete="username" required autofocus>
      </label>
      <label>
        Senha
        <input id="password" autocomplete="current-password" required type="password">
      </label>
      <button id="submitButton" type="submit">Entrar</button>
      <div id="feedback" class="feedback" role="alert" hidden></div>
    </form>
    <nav class="auth-links" aria-label="Opções de acesso">
      <a id="registerLink" href="/register.html" hidden>Criar conta</a>
      <a id="invitationLink" href="/invite.html">Tenho um convite</a>
      <a id="forgotPasswordLink" href="/forgot-password.html" hidden>Esqueci minha senha</a>
    </nav>
  </main>

  <script src="/login.js?v=1.0.6"></script>
</body>
</html>
