<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendador de Contas - Multi-family</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div><p class="eyebrow">Ambiente multi-family</p><h1>Agendador de Contas</h1><p id="familyStatus">Carregando família...</p></div>
    <div class="header-actions"><select id="familySelect" aria-label="Família ativa" hidden></select><button id="logoutButton" class="header-button">Sair</button></div>
  </header>
  <main class="page">
    <p id="feedback" class="form-feedback" role="alert" hidden></p>
    <section class="panel">
      <div class="section-title"><h2>Contas</h2><span id="roleStatus" class="section-note"></span></div>
      <form id="accountForm"><input id="accountId" type="hidden"><div class="grid two"><label>Nome<input id="name" maxlength="80" required></label><label>Valor<input id="amount" type="number" min="0.01" step="0.01" required></label></div><div class="grid two"><label>Dia<input id="dueDay" type="number" min="1" max="31" required></label><label>Início<input id="startDate" type="date" required></label></div><div class="grid two"><label>País<select id="country"><option>UnitedKingdom</option><option>Portugal</option><option>Brazil</option></select></label><label>Moeda<select id="currency"><option>GBP</option><option>EUR</option><option>BRL</option></select></label></div><label>Duração<input id="duration" type="number" min="0" value="0"></label><label>Observações<textarea id="notes" maxlength="300"></textarea></label><button class="primary">Guardar</button><button id="cancelEdit" type="button" class="secondary">Cancelar</button></form>
      <div class="table-wrap"><table><thead><tr><th>Conta</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Ações</th></tr></thead><tbody id="accountsTable"></tbody></table></div>
    </section>
    <section class="panel"><div class="section-title"><h2>Configuração familiar</h2></div><form id="settingsForm"><div class="grid two"><label>Moeda<select id="defaultCurrency"><option>GBP</option><option>EUR</option><option>BRL</option></select></label><label>Timezone<input id="timeZoneId" required></label></div><label>Horário<input id="reminderTime" type="time" required></label><button class="primary">Guardar</button></form></section>
    <section id="membersPanel" class="panel" hidden><div class="section-title"><h2>Membros</h2></div><form id="memberForm"><div class="grid two"><label>Email<input id="memberEmail" type="email" required></label><label>Role<select id="memberRole"><option>Member</option><option>Admin</option></select></label></div><button class="primary">Adicionar/reativar</button></form><div id="membersList"></div></section>
  </main>
  <script src="/multi-family.js"></script>
</body>
</html>
